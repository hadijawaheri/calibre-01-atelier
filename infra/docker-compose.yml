# Local MongoDB only (the app itself runs on the host with pnpm dev).
# A single-node replica set: orders reserve stock inside transactions.
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports: ["127.0.0.1:27018:27018"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is primary
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27018",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27018' }] }).ok }",
        ]
      interval: 5s
      retries: 30
volumes:
  mongo-data:
